<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModelForge Guardian Dashboard</title>
<meta name="author" content="Vaishnavi">
<style>
:root {
  color-scheme: dark;
  --bg: #0c0e14;
  --surface-1: #141821;
  --surface-2: #1b2030;
  --border: #262c3d;
  --grid: #232838;
  --text-primary: #f3f4f8;
  --text-secondary: #b6bccb;
  --text-muted: #7c8499;
  --accent: #3987e5;
  --muted-mark: #4a5266;
  --good: #3fb37f;
  --bad: #e66767;
  --warn: #c98500;
  --s-guardian_apc_plus: #3987e5;
  --s-random: #d95926;
  --s-guardian_v1: #199e70;
  --s-generic: #c98500;
  --s-deep_boundary: #d55181;
  --s-guardian_apc: #008300;
  --s-guardian_delta: #6b7489;
  --s-apc_near_miss: #e66767;
  --seq-0: #1b2030; --seq-1: #184f95; --seq-2: #256abf; --seq-3: #3987e5; --seq-4: #6da7ec; --seq-5: #b7d3f6;
  --shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 8px 24px rgba(0,0,0,0.25);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f5f7;
  --surface-1: #ffffff;
  --surface-2: #f7f8fa;
  --border: #e3e5ea;
  --grid: #eceef2;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7b7a75;
  --accent: #2a78d6;
  --muted-mark: #c4c7cf;
  --good: #1a8a5a;
  --bad: #c93a3a;
  --warn: #a86f00;
  --s-guardian_apc_plus: #2a78d6;
  --s-random: #eb6834;
  --s-guardian_v1: #1baf7a;
  --s-generic: #eda100;
  --s-deep_boundary: #e87ba4;
  --s-guardian_apc: #008300;
  --s-guardian_delta: #8a90a0;
  --s-apc_near_miss: #e34948;
  --seq-0: #f3f6fb; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #1c5cab;
  --shadow: 0 1px 2px rgba(16,24,40,0.05), 0 4px 16px rgba(16,24,40,0.06);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f4f5f7; --surface-1: #ffffff; --surface-2: #f7f8fa; --border: #e3e5ea; --grid: #eceef2;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7b7a75; --accent: #2a78d6;
    --muted-mark: #c4c7cf; --good: #1a8a5a; --bad: #c93a3a; --warn: #a86f00;
    --s-guardian_apc_plus: #2a78d6; --s-random: #eb6834; --s-guardian_v1: #1baf7a; --s-generic: #eda100;
    --s-deep_boundary: #e87ba4; --s-guardian_apc: #008300; --s-guardian_delta: #8a90a0; --s-apc_near_miss: #e34948;
    --seq-0: #f3f6fb; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #1c5cab;
    --shadow: 0 1px 2px rgba(16,24,40,0.05), 0 4px 16px rgba(16,24,40,0.06);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text-primary);
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
code, .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px 80px; }
header.top {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.top-inner { max-width: 1180px; margin: 0 auto; padding: 14px 28px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px; }
.brand h1 { font-size: 16px; margin: 0; letter-spacing: 0.1px; }
.brand p { margin: 0; font-size: 12px; color: var(--text-muted); }
nav.tabs { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
nav.tabs button, .chip, .ghost {
  font: inherit; font-size: 13px; color: var(--text-secondary); background: transparent;
  border: 1px solid transparent; border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
nav.tabs button:hover, .ghost:hover { background: var(--surface-2); color: var(--text-primary); }
nav.tabs button[aria-selected="true"] { background: var(--surface-1); border-color: var(--border); color: var(--text-primary); box-shadow: var(--shadow); }
.ghost { border-color: var(--border); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.meta { font-size: 12px; color: var(--text-muted); margin: 32px 0 10px; display: flex; gap: 14px; flex-wrap: wrap; }
.meta span b { color: var(--text-secondary); font-weight: 500; }
.hero { margin: 8px 0 36px; }
.hero h2 { font-size: 24px; line-height: 1.3; margin: 0 0 12px; letter-spacing: -0.3px; max-width: 900px; }
.hero p { margin: 0; color: var(--text-secondary); max-width: 860px; }
.grid { display: grid; gap: 24px; }
section > * + * { margin-top: 28px !important; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.two { grid-template-columns: minmax(0, 1fr); }
.half { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 900px) { .two, .half { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; padding: 24px 26px 22px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
.card .sub { margin: 0 0 18px; max-width: 760px; color: var(--text-muted); font-size: 12.5px; }
.kpi .label { color: var(--text-muted); font-size: 12px; }
.kpi .value { font-size: 34px; font-weight: 650; letter-spacing: -0.5px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .note { color: var(--text-secondary); font-size: 12px; margin-top: 2px; }
.kpi .delta { font-size: 12px; font-weight: 600; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-secondary); background: var(--surface-2); white-space: nowrap; }
.pill.ok::before { content: "✓"; color: var(--good); font-weight: 700; }
.pill.no::before { content: "✕"; color: var(--bad); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0 0 16px; font-size: 12.5px; color: var(--text-secondary); }
.legend label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.legend input { accent-color: var(--accent); margin: 0; }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
svg { display: block; width: 100%; max-width: 660px; height: auto; overflow: visible; }
svg text { fill: var(--text-muted); font-size: 11px; }
.axis line, .gridline { stroke: var(--grid); stroke-width: 1; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--text-muted); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover td { background: var(--surface-2); }
.scroll { overflow-x: auto; }
.heat td.cell { text-align: center; font-variant-numeric: tabular-nums; font-size: 12.5px; border: 2px solid var(--surface-1); border-radius: 6px; min-width: 64px; }
.tooltip { position: fixed; pointer-events: none; z-index: 50; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.08s; min-width: 140px; }
.tooltip .t-title { color: var(--text-muted); font-size: 11.5px; margin-bottom: 4px; }
.tooltip .t-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tooltip .t-row span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.tooltip b { font-variant-numeric: tabular-nums; }
details.data { margin-top: 10px; }
details.data summary { cursor: pointer; color: var(--text-muted); font-size: 12px; }
.empty { padding: 60px 24px; text-align: center; color: var(--text-secondary); }
.empty code { background: var(--surface-2); padding: 2px 6px; border-radius: 6px; }
.drop { margin: 18px auto 0; max-width: 520px; border: 1.5px dashed var(--border); border-radius: 14px; padding: 22px; }
.flow { display: flex; flex-direction: column; gap: 6px; }
.node { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
.node .op { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; color: #fff; }
.node .nm { color: var(--text-secondary); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
.node .sh { margin-left: auto; color: var(--text-muted); font-size: 11.5px; }
.arrow { text-align: center; color: var(--text-muted); font-size: 11px; line-height: 1; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .cols { grid-template-columns: 1fr; } .wrap { padding: 0 16px 48px; } .top-inner { padding: 12px 16px; } }
.decision { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); gap: 8px; }
.decision:last-child { border-bottom: 0; }
.small { font-size: 12px; color: var(--text-muted); }
.claim { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; margin: 10px 0; color: var(--text-secondary); }
section[hidden] { display: none; }

/* Motion: cards rise in, lines draw, bars grow, numbers count up. */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes pop { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
section[data-panel] .card, section[data-panel] .hero, .meta { animation: rise 0.6s cubic-bezier(0.2, 0.75, 0.2, 1) both; }
svg .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards; }
svg .bar { transform-box: fill-box; transform-origin: left center; animation: grow 0.9s cubic-bezier(0.2, 0.75, 0.2, 1) both; }
svg .dot { transform-box: fill-box; transform-origin: center; animation: pop 0.35s cubic-bezier(0.3, 1.5, 0.5, 1) both; }
svg .late { animation: fade 0.5s ease both; }
.heat td.cell { animation: fade 0.5s ease both; transition: transform 0.15s ease; }
.heat td.cell:hover { transform: scale(1.06); }
.card { transition: transform 0.25s ease, border-color 0.25s ease; }
.card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
nav.tabs button { transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease; }
.tooltip { transition: opacity 0.12s ease; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  svg .line { stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="logo" aria-hidden="true">MF</div>
      <div><h1>ModelForge · Guardian-APC</h1><p>Coverage-guided translation validation for ML compilers · by Vaishnavi</p></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Dashboard sections">
      <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button role="tab" data-tab="faults">Fault families</button>
      <button role="tab" data-tab="stats">Statistics</button>
      <button role="tab" data-tab="inspector">Model inspector</button>
      <button role="tab" data-tab="corpus">Corpus</button>
    </nav>
    <button class="ghost" id="theme" type="button" aria-label="Toggle colour theme">◐ Theme</button>
  </div>
</header>

<main class="wrap" id="app"></main>
<footer class="wrap small" style="padding-top:0">ModelForge and Guardian-APC · designed and built by <b>Vaishnavi</b></footer>
<div class="tooltip" id="tip" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script>
"use strict";
(() => {
const STRATS = ["guardian_apc_plus", "guardian_apc", "random", "guardian_v1", "generic", "deep_boundary", "guardian_delta", "apc_near_miss", "union_unordered", "apc_without_deep"];
// Eight coloured series at most; the two remaining ablations appear in tables and the leaderboard only.
const LINE_STRATS = STRATS.filter((k) => !["guardian_delta", "union_unordered", "apc_without_deep"].includes(k));
const NAMES = {
  guardian_apc_plus: "Guardian-APC+ (ours)", guardian_apc: "Guardian-APC", guardian_delta: "Rewrite-aware only",
  apc_near_miss: "APC + near-miss", random: "Uniform random", guardian_v1: "Guardian v1",
  generic: "Generic probes", deep_boundary: "Deep boundary only", union_unordered: "Union, unordered",
  apc_without_deep: "APC order, no deep"
};
const DEFAULT_ON = new Set(["guardian_apc_plus", "guardian_apc", "random", "guardian_v1"]);
const OP_COLOURS = { INPUT: "#64748b", RETURN: "#64748b", GEMM: "#2563eb", MATMUL: "#2563eb", FUSED_GEMM_RELU: "#0d9488", ADD: "#2563eb", RELU: "#b45309", SIGMOID: "#be185d", SOFTMAX: "#0e7490" };

const app = document.getElementById("app");
const tip = document.getElementById("tip");
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const colour = (s) => css("--s-" + s) || css("--muted-mark");
const pct = (v, d = 1) => v == null || isNaN(v) ? "n/a" : (v * 100).toFixed(d) + "%";
const fmt = (v, d = 1) => v == null || isNaN(v) ? "n/a" : Number(v).toFixed(d);
const el = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else if (k === "text") node.textContent = v;
    else if (k === "style") node.setAttribute("style", v); else node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return node;
};
const svgEl = (tag, attrs = {}) => {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
};

// ------------------------------------------------------------- tooltip
function showTip(evt, title, rows) {
  tip.replaceChildren(el("div", { class: "t-title", text: title }));
  for (const r of rows) {
    const left = el("span");
    if (r.colour) left.append(el("i", { class: "swatch", style: "background:" + r.colour }));
    left.append(document.createTextNode(r.label));
    tip.append(el("div", { class: "t-row" }, left, el("b", { text: r.value })));
  }
  tip.style.opacity = 1;
  const x = Math.min(evt.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  const y = Math.min(evt.clientY + 14, window.innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.opacity = 0; };

// ------------------------------------------------------------- charts
function lineChart(points, series, opts) {
  // points: x values; series: [{key, values:[y], lo:[], hi:[]}]
  const W = 720, H = 320, m = { l: 44, r: 170, t: 12, b: 34 };
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": opts.label });
  svg.style.maxWidth = "900px";
  const xs = (i) => m.l + (i / (points.length - 1)) * (W - m.l - m.r);
  const ys = (v) => m.t + (1 - (v - opts.yMin) / (opts.yMax - opts.yMin)) * (H - m.t - m.b);
  for (let t = 0; t <= 4; t++) {
    const v = opts.yMin + (t / 4) * (opts.yMax - opts.yMin);
    svg.append(svgEl("line", { class: "gridline", x1: m.l, x2: W - m.r, y1: ys(v), y2: ys(v) }));
    const label = svgEl("text", { x: m.l - 8, y: ys(v) + 4, "text-anchor": "end" }); label.textContent = pct(v, 0); svg.append(label);
  }
  points.forEach((p, i) => { const t = svgEl("text", { x: xs(i), y: H - 12, "text-anchor": "middle" }); t.textContent = p; svg.append(t); });
  const xl = svgEl("text", { x: (m.l + W - m.r) / 2, y: H, "text-anchor": "middle" }); xl.textContent = opts.xLabel; svg.append(xl);
  const labels = [];
  for (const s of series) {
    const c = colour(s.key);
    const d = s.values.map((v, i) => `${i ? "L" : "M"}${xs(i)},${ys(v)}`).join("");
    svg.append(svgEl("path", { d, fill: "none", stroke: c, "stroke-width": s.key === "guardian_apc_plus" ? 2.5 : 2, "stroke-linejoin": "round", "stroke-linecap": "round", class: "line", pathLength: 1 }));
    s.values.forEach((v, i) => svg.append(svgEl("circle", { cx: xs(i), cy: ys(v), r: 3.5, fill: c, stroke: css("--surface-1"), "stroke-width": 2, class: "dot", style: `animation-delay:${(0.3 + 1.4 * i / Math.max(1, s.values.length - 1)).toFixed(2)}s` })));
    labels.push({ key: s.key, y: ys(s.values[s.values.length - 1]), v: s.values[s.values.length - 1] });
  }
  // Direct end labels, nudged apart to avoid collisions.
  labels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 14) labels[i].y = labels[i - 1].y + 14;
  for (const l of labels) {
    const t = svgEl("text", { x: W - m.r + 10, y: l.y + 4, class: "late", style: "animation-delay:1.6s" });
    t.textContent = `${NAMES[l.key]}  ${pct(l.v, 0)}`;
    t.setAttribute("style", `animation-delay:1.6s;fill:${css("--text-secondary")};font-weight:${l.key === "guardian_apc_plus" ? 600 : 400}`);
    svg.append(t);
  }
  const cross = svgEl("line", { y1: m.t, y2: H - m.b, stroke: css("--text-muted"), "stroke-width": 1, opacity: 0 });
  svg.append(cross);
  const hit = svgEl("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent" });
  hit.addEventListener("pointermove", (e) => {
    const box = svg.getBoundingClientRect();
    const px = ((e.clientX - box.left) / box.width) * W;
    const i = Math.max(0, Math.min(points.length - 1, Math.round(((px - m.l) / (W - m.l - m.r)) * (points.length - 1))));
    cross.setAttribute("x1", xs(i)); cross.setAttribute("x2", xs(i)); cross.setAttribute("opacity", 0.6);
    const rows = series.map((s) => ({ label: NAMES[s.key], value: pct(s.values[i]), colour: colour(s.key), v: s.values[i] })).sort((a, b) => b.v - a.v);
    showTip(e, `${opts.xLabel} ${points[i]}`, rows);
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("opacity", 0); hideTip(); });
  svg.append(hit);
  return svg;
}

function barList(rows, opts = {}) {
  // Horizontal bars with optional CI whiskers; emphasis on the highlighted row.
  const W = 560, rowH = 30, m = { l: 150, r: 64, t: 4, b: 22 };
  const H = m.t + rows.length * rowH + m.b;
  const max = opts.max ?? Math.max(...rows.map((r) => r.hi ?? r.value)) * 1.05;
  const xs = (v) => m.l + (v / max) * (W - m.l - m.r);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": opts.label || "bar chart" });
  for (let t = 0; t <= 4; t++) {
    const v = (t / 4) * max;
    svg.append(svgEl("line", { class: "gridline", x1: xs(v), x2: xs(v), y1: m.t, y2: H - m.b }));
    const tx = svgEl("text", { x: xs(v), y: H - 6, "text-anchor": "middle" }); tx.textContent = opts.tick ? opts.tick(v) : fmt(v, 0); svg.append(tx);
  }
  rows.forEach((r, i) => {
    const y = m.t + i * rowH + 7, h = rowH - 14;
    const lab = svgEl("text", { x: m.l - 10, y: y + h / 2 + 4, "text-anchor": "end" });
    lab.textContent = r.label;
    lab.setAttribute("style", `fill:${css(r.highlight ? "--text-primary" : "--text-secondary")};font-weight:${r.highlight ? 600 : 400};font-size:12px`);
    svg.append(lab);
    const fill = r.colour || (r.highlight ? css("--accent") : css("--muted-mark"));
    const w = Math.max(2, xs(r.value) - m.l);

  const c = bench.corpus;
  const depthRows = Object.entries(c.depths).map(([d, n]) => ({ label: `${d} hidden layer${d === "1" ? "" : "s"}`, value: n, highlight: false, colour: css("--accent"), tip: [{ label: "models", value: String(n) }] }));
  const neuronRows = [["Unstable", c.neurons.unstable, "--warn"], ["Stable active", c.neurons.stable_active, "--good"], ["Stable inactive", c.neurons.stable_inactive, "--muted-mark"]].map(([label, value, tok]) => ({ label, value, colour: css(tok), tip: [{ label: "neurons", value: String(value) }] }));
  wrap.append(el("div", { class: "grid kpis" },
    ...[["Models", c.models], ["Injected faults", c.faults_total], ["Observable", c.observable], ["Unknown (excluded)", c.unknown], ["Negative controls", c.controls], ["IBP soundness violations", c.ibp_violations]].map(([l, v]) => el("div", { class: "card kpi" }, el("div", { class: "label", text: l }), el("div", { class: "value", text: String(v), "data-count": String(v) })))));
  wrap.append(el("div", { class: "grid half" },
    card("Depth distribution", "Synthetic He-initialised classifiers; depth cycles from 1 to 4 hidden ReLU layers, widths 4 to 16, inputs 4 to 16, classes 2 to 5.", barList(depthRows, { valueText: (r) => String(r.value), tick: (v) => fmt(v, 0), label: "Models by depth" })),
    card("Neuron stability over D", "Interval bound propagation on [-10, 10]^n. Unstable neurons are the targets for deep boundary probes.", barList(neuronRows, { valueText: (r) => String(r.value), tick: (v) => fmt(v, 0), label: "Neuron stability counts" }))));
  wrap.append(el("div", { style: "margin-top:16px" }, card("Models", "Every model in the corpus, with its layer widths and fault counts.",
    details("Show all " + bench.models.length + " models", dataTable(["Model", "Inputs", "Classes", "Hidden widths", "Unstable", "Faults", "Observable"], bench.models.map((x) => [x.name, String(x.inputs), String(x.classes), x.hidden.join(" · "), String(x.unstable), String(x.faults), String(x.observable)]), [1, 2, 4, 5, 6])),
    bench.misses.length ? details(`Guardian-APC misses (${bench.misses.length} listed)`, dataTable(["Model", "Fault"], bench.misses.map((x) => [x.model, x.fault]))) : null)));
  wrap.append(el("p", { class: "small", style: "margin-top:16px", text: `Config: budget ${bench.config.budget}, ${bench.config.random_seeds} random seeds, ${bench.config.oracle_probes} oracle probes per fault, tolerance ${bench.config.tolerance}, master seed ${bench.config.seed}. A fault counts as observable when any suite or the random oracle exposes it; others are reported as unknown and excluded.` }));
  return wrap;
}

// ------------------------------------------------------------- boot
function render(data) {
  app.replaceChildren();
  if (!data || !data.bench) { empty(); return; }
  const b = data.bench;
  app.append(el("div", { class: "meta" },
    el("span", {}, "Author ", el("b", { text: b.author || "Vaishnavi" })), el("span", {}, "Generated ", el("b", { text: b.generated_at })), el("span", {}, "Platform ", el("b", { text: `${b.platform} · ${b.compiler}` })),
    el("span", {}, "Corpus ", el("b", { text: `${b.corpus.models} models · ${b.corpus.faults_total} faults` })), el("span", {}, "Budget ", el("b", { text: String(b.config.budget) }))));
  app.append(overview(b), faults(b), stats(b), inspector(data.inspect), corpus(b));
  stagger(app);
  selectTab(currentTab);
}
function empty() {
  const input = el("input", { type: "file", accept: ".json" });
  input.addEventListener("change", () => { const f = input.files[0]; if (f) f.text().then((t) => render({ bench: JSON.parse(t), inspect: null })); });
  app.append(el("div", { class: "card empty" }, el("h2", { text: "No benchmark data yet" }),
    el("p", {}, "Build the project and run ", el("code", { text: "modelforge_bench" }), " (or menu option 6 in ", el("code", { text: "modelforge_studio" }), "). It writes ", el("code", { text: "dashboard/data.js" }), " next to this page."),
    el("div", { class: "drop" }, el("p", { text: "Or load a results.json file:" }), input)));
}
let currentTab = "overview";
function countUp(panel) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  panel.querySelectorAll("[data-count]").forEach((node) => {
    const match = /^(\d+(?:\.(\d+))?)(%?)$/.exec(node.dataset.count);
    if (!match) return;
    const target = parseFloat(match[1]), digits = match[2] ? match[2].length : 0, suffix = match[3];
    const start = performance.now(), duration = 1100;
    const step = (now) => {
      const t = Math.min(1, (now - start) / duration), eased = 1 - Math.pow(1 - t, 3);
      node.textContent = (target * eased).toFixed(digits) + suffix;
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function stagger(root) {
  root.querySelectorAll("section[data-panel]").forEach((panel) => {
    panel.querySelectorAll(".card, .hero").forEach((node, i) => { node.style.animationDelay = Math.min(i * 0.07, 0.6).toFixed(2) + "s"; });
    panel.querySelectorAll(".heat tbody tr").forEach((row, ri) => row.querySelectorAll("td.cell").forEach((cell, ci) => { cell.style.animationDelay = (0.2 + ri * 0.035 + ci * 0.025).toFixed(3) + "s"; }));
  });
}
function selectTab(name) {
  currentTab = name;
  document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  document.querySelectorAll("section[data-panel]").forEach((s) => { s.hidden = s.dataset.panel !== name; if (!s.hidden) countUp(s); });
  try { localStorage.setItem("mf-tab", name); } catch (e) { /* storage unavailable */ }
}
document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => selectTab(b.dataset.tab)));
try { currentTab = localStorage.getItem("mf-tab") || "overview"; } catch (e) { /* storage unavailable */ }
try { const t = localStorage.getItem("mf-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* storage unavailable */ }
document.getElementById("theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("mf-theme", document.documentElement.dataset.theme); } catch (e) { /* storage unavailable */ }
  render(window.MODELFORGE_DATA);
});
render(window.MODELFORGE_DATA);
})();
</script>

name: ModelForge build and Guardian demo

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            exe: ""
            generated_exe: build/generated_build/generated_model
          - os: windows-latest
            exe: .exe
            generated_exe: build/generated_build/Release/generated_model.exe
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Guardian fault injection comparison
        shell: bash
        run: |
          "build/Release/modelforge_guardian_eval${{ matrix.exe }}" ModelForge/review_2_core_implementation/models/iris_demo.mforge > build/guardian_eval.csv
          cat build/guardian_eval.csv
      - name: Guardian-APC research benchmark (96 models)
        shell: bash
        run: |
          "build/Release/modelforge_bench${{ matrix.exe }}" --no-color --out build/research --dashboard build/dashboard
          cp dashboard/index.html build/dashboard/index.html
          python -c "import json; d=json.load(open('build/research/results.json')); s={x['name']:x for x in d['strategies']}; assert d['corpus']['ibp_violations']==0; assert all(x['false_positives']==0 for x in d['strategies']); assert s['guardian_apc']['overall']['rate'] >= s['random']['overall']['rate']; print({k:round(v['overall']['rate'],4) for k,v in s.items()})"
      - name: Compile Iris and catch a deliberate bad rewrite
        shell: bash
        run: |
          "build/Release/modelforge${{ matrix.exe }}" ModelForge/review_2_core_implementation/models/iris_demo.mforge --out build/generated --guardian-demo-bug --no-ir
          python -c "import json; from pathlib import Path; p=Path('build/generated'); c=json.loads((p/'optimization_certificate.json').read_text()); x=json.loads((p/'counterexample.json').read_text()); assert c['translation_validation']['status']=='PASS'; assert x['input']; assert x['original_output'] != x['candidate_output']; assert any(d['pass']=='dense_relu_fusion' and d['accepted'] for d in c['guardian_decisions'])"
      - name: Configure generated C++
        run: cmake -S build/generated -B build/generated_build -DCMAKE_BUILD_TYPE=Release
      - name: Build generated C++
        run: cmake --build build/generated_build --config Release
      - name: Run generated program
        shell: bash
        run: |
          output=$("${{ matrix.generated_exe }}")
          echo "$output"
          [[ "$output" == *"Prediction: 2"* ]]
          real_input=$("${{ matrix.generated_exe }}" 1 2 3 4)
          echo "$real_input"
          [[ "$real_input" == *"Scores:"* ]]
          [[ "$real_input" == *"Prediction: 1"* ]]
          MODEL_OUTPUT="$real_input" python -c "import os; s=os.environ['MODEL_OUTPUT']; v=[float(x) for x in s.split('Scores:')[1].splitlines()[0].split()]; assert len(v)==3 and abs(v[1]-0.55681473)<1e-5 and abs(sum(v)-1)<1e-5"
          if "${{ matrix.generated_exe }}" 1 2 3 >/dev/null 2>&1; then exit 1; fi
          if "${{ matrix.generated_exe }}" 1 2 NaN 4 >/dev/null 2>&1; then exit 1; fi
          "${{ matrix.generated_exe }}" --csv ModelForge/review_2_core_implementation/models/iris_inputs.csv > build/batch_predictions.csv
          cat build/batch_predictions.csv
          python -c "import csv; r=list(csv.reader(open('build/batch_predictions.csv'))); assert len(r)==3 and r[0]==['row','prediction','score_0','score_1','score_2']; assert [x[1] for x in r[1:]]==['1','2']; assert all(abs(sum(map(float,x[2:]))-1)<1e-5 for x in r[1:])"
          if "${{ matrix.generated_exe }}" --csv ModelForge/review_2_core_implementation/models/iris_inputs_invalid.csv >/dev/null 2>&1; then exit 1; fi
      - name: Save generated code and Guardian evidence
        uses: actions/upload-artifact@v4
        with:
          name: modelforge-${{ matrix.os }}-demo
          path: |
            build/generated/model.cpp
            build/generated/model.h
            build/generated/optimization_certificate.json
            build/generated/counterexample.json
            build/guardian_eval.csv
            build/batch_predictions.csv
            build/research/results.json
            build/research/cases.csv
            build/dashboard/index.html
            build/dashboard/data.js

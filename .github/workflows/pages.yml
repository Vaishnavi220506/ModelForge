name: Publish ModelForge website

# Publishes website/ (interactive shrink lab) and dashboard/ (research results)
# to GitHub Pages. Enable it once: repository Settings, Pages, Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r website dashboard _site/
          printf '<!doctype html><meta charset="utf-8"><title>ModelForge</title><meta http-equiv="refresh" content="0; url=website/"><a href="website/">ModelForge website</a>\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
